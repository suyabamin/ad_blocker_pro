<ytd-app>
  <tp-yt-paper-dialog class="style-scope ytd-popup-container" opened>
    <ytd-enforcement-message-view-model class="style-scope ytd-popup-container">
      <div id="dialog" class="style-scope ytd-enforcement-message-view-model">
        <h2 id="title">Ad blockers violate YouTube's Terms of Service</h2>
        <div id="dismiss-button">
          <button aria-label="Dismiss" class="yt-spec-button-shape-next">Dismiss</button>
        </div>
      </div>
    </ytd-enforcement-message-view-model>
  </tp-yt-paper-dialog>
  <tp-yt-iron-overlay-backdrop class="opened"></tp-yt-iron-overlay-backdrop>
  <video src="blob:https://www.youtube.com/video"></video>
</ytd-app>
